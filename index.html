<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOI-STEM++ · แดชบอร์ดผลการประเมินหลักสูตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12325c; --navy-2:#1b4478; --blue:#2f6fbd; --blue-2:#5b91cf; --blue-soft:#a9c8e6;
  --amber:#dfa53f; --green:#1f9d6b; --bg:#f4f6fa; --card:#ffffff;
  --line:#e6ecf3; --line-2:#eef2f7; --text:#17263b; --muted:#7a8a9e; --track:#eaeef4;
  --radius:14px; --shadow:0 1px 2px rgba(18,50,92,.05), 0 6px 20px rgba(18,50,92,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:320px;flex:0 0 320px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-2)}
.logo-boi{width:100%;max-width:205px;height:auto;display:block}
.side-logos{display:flex;align-items:center;gap:10px;margin:15px 0 15px;
  padding-top:15px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.side-logos img{width:auto;display:block}
/* โลโก้ มจธ. เป็นรูปจัตุรัส ตัวอักษรจึงห้อยต่ำกว่าเส้นฐานของโลโก้ตัวอักษรอีกสองอัน
   ยกขึ้น 5px ให้ฐานตรงกัน (ใช้ transform เพื่อไม่ให้ดันความสูงของแถว) */
.side-logos img.kmutt{height:58px;transform:translateY(-5px)}
.side-logos img.kx{height:46px}
.side-logos img.kxb{height:52px}
.side-logos .vr{width:1px;height:38px;background:var(--line);flex:0 0 1px}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
.brand-sub{font-size:15px;font-weight:700;color:var(--navy);margin-top:2px;line-height:1.35}
.side-scroll{flex:1;overflow-y:auto;padding:10px 10px 20px}
.side-foot{padding:12px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.vo-badge{background:#eef3fa;border:1px solid #d5e3f3;color:var(--navy);border-radius:8px;
  padding:7px 10px;font-size:12px;font-weight:600;text-align:center}

.nav-home{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:9px 10px;border-radius:9px;color:var(--text);font-weight:600;
}
.nav-home:hover{background:var(--bg)}
.nav-home.active{background:var(--navy);color:#fff}
.nav-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:14px 10px 6px}
.course-item{margin-bottom:2px}
.course-btn{
  display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:none;border:0;
  padding:8px 10px;border-radius:9px;color:var(--text);line-height:1.35;
}
.course-btn:hover{background:var(--bg)}
.course-btn.active{background:#eaf1fa;color:var(--navy)}
.course-idx{
  flex:0 0 20px;height:20px;border-radius:6px;background:var(--track);color:var(--muted);
  font-size:10.5px;font-weight:700;display:grid;place-items:center;margin-top:1px
}
.course-btn.active .course-idx,.course-btn:hover .course-idx{background:var(--navy);color:#fff}
.course-name{flex:1;font-size:12.6px;font-weight:600}
.course-meta{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.caret{flex:0 0 12px;color:var(--muted);font-size:10px;margin-top:4px;transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.batch-list{padding:0 0 0 38px;max-height:0;opacity:0}
.batch-list.open{max-height:640px;opacity:1;padding:2px 0 6px 38px}
.batch-btn{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;
  padding:5px 9px;border-radius:7px;color:var(--muted);font-size:12px;
}
.batch-btn:hover{background:var(--bg);color:var(--text)}
.batch-btn.active{background:var(--navy);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:var(--track);flex:0 0 6px}
.batch-btn.has-data .dot{background:var(--green)}
.batch-btn.active .dot{background:#fff}
.batch-score{margin-left:auto;font-size:11px;font-weight:600}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text);
  font-size:12.5px;font-weight:600;transition:.12s;
}
.btn:hover{border-color:var(--blue-soft);background:#f8fafd}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn-danger{color:#c0392b;border-color:#f3d9d5}
.btn-danger:hover{background:#fdf3f2;border-color:#e8b9b2}

.main{flex:1;min-width:0;padding:26px 30px 60px}

/* ---------- page header ---------- */
.page-head{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:2px solid var(--navy);margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:600}
.page-title{font-size:25px;font-weight:700;color:var(--navy);line-height:1.28;margin:3px 0 0;max-width:820px}
.page-title .en{color:var(--blue);font-weight:600}
.page-sub{color:var(--muted);margin-top:6px;font-size:13px}
.kpi-row{display:flex;gap:0;margin-left:auto;align-items:flex-start}
.kpi{padding:0 22px;border-left:1px solid var(--line);text-align:left}
.kpi:first-child{border-left:0}
.kpi-val{font-size:30px;font-weight:700;color:var(--navy);line-height:1.05}
.kpi-val small{font-size:14px;color:var(--muted);font-weight:600}
.kpi-val.pos{color:var(--green)}
.kpi-lb{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}

.head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 20px;box-shadow:var(--shadow)}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:15px}
.card-n{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em}
.card.dark .card-n{color:var(--blue-soft)}
.card-t{font-size:14.5px;font-weight:700;color:var(--navy)}
.card.dark .card-t{color:#fff}
.card-note{font-size:11.5px;color:var(--muted);margin:-8px 0 14px}
.card.dark .card-note{color:#a9c0dc}
.sub-h{font-size:11.5px;color:var(--muted);font-weight:600;margin:16px 0 8px}
.sub-h:first-child{margin-top:0}

/* rows + bars */
.row{margin-bottom:11px}
.row:last-child{margin-bottom:0}
.row-top{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.row-lb{font-size:13px;flex:1;min-width:0}

/* ---- ชื่อหัวข้อยาว: ตัดที่ 2 บรรทัด + ชี้เมาส์เพื่อดูเต็ม ---- */
.lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word}
.card.labels-full .lbl{display:block;-webkit-line-clamp:unset;overflow:visible}
.tipwrap{position:relative}
.tipwrap.is-clamped{cursor:help}
.tipwrap.is-clamped::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0}
.tipwrap.is-clamped:hover::after{
  content:attr(data-full);position:absolute;left:0;top:calc(100% + 6px);z-index:40;
  min-width:200px;max-width:290px;width:max-content;
  background:var(--navy);color:#fff;font-size:12px;font-weight:500;line-height:1.55;
  padding:9px 12px;border-radius:9px;white-space:normal;text-align:left;
  box-shadow:0 8px 24px rgba(10,25,45,.28);pointer-events:none}
.card.dark .tipwrap.is-clamped:hover::after{background:#fff;color:var(--navy)}
/* การ์ดคอลัมน์ขวาสุด ให้ป้ายชิดขวาแทน กันล้นขอบจอ */
.grid>.card:last-child .tipwrap.is-clamped:hover::after,
.grid>.card:nth-child(4) .tipwrap.is-clamped:hover::after{left:auto;right:0}
.lbl-btn{border:0;background:none;color:var(--muted);font-size:13px;line-height:1;
  padding:3px 5px;border-radius:6px;opacity:0;transition:.15s}
.card:hover .lbl-btn{opacity:1}
.lbl-btn:hover{background:var(--bg);color:var(--blue)}
.card.labels-full .lbl-btn{opacity:1;background:#eaf1fa;color:var(--navy)}
/* จอสัมผัสไม่มีการชี้เมาส์ — ต้องเห็นปุ่มตลอด ไม่งั้นกางชื่อเต็มไม่ได้เลย */
@media (hover:none){
  .lbl-btn,.replay-btn{opacity:.6}
  .tipwrap.is-clamped{cursor:default}
}
.row-val{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap}
.row-val.amber{color:var(--amber)}
.row-val.pos{color:var(--green)}
.bar{height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .5s ease}
.bar.deep>span{background:var(--navy)}
.bar.amber>span{background:var(--amber)}
.bar.soft>span{background:var(--blue-2)}

/* gender */
.gender{display:flex;height:24px;border-radius:6px;overflow:hidden;font-size:11.5px;font-weight:600;color:#fff}
.gender>div{display:flex;align-items:center;padding:0 9px;white-space:nowrap}
.g-f{background:var(--navy)}
.g-m{background:var(--blue-2)}
.mini{font-size:11.5px;color:var(--muted);margin-top:5px}
.big-num{font-size:31px;font-weight:700;color:var(--navy);line-height:1.1}
.big-num small{font-size:13px;color:var(--muted);font-weight:600;margin-left:5px}

/* count pills */
.cnt-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.cnt-row:last-child{border-bottom:0}
.cnt-lb{flex:1;font-size:13px}
.pill{min-width:30px;height:24px;padding:0 8px;border-radius:12px;background:var(--track);color:var(--muted);
  font-size:12px;font-weight:700;display:grid;place-items:center}
.pill.hi{background:var(--navy);color:#fff}

/* skills before/after */
.skill{margin-bottom:13px}
.skill:last-child{margin-bottom:0}
.sk-track{height:8px;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.sk-after{position:absolute;left:0;top:0;height:100%;background:var(--blue-soft);border-radius:4px}
.sk-before{position:absolute;left:0;top:0;height:100%;background:var(--navy);border-radius:4px}
.sk-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* summary strips */
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;margin-top:16px}
.strip .s-lb{font-size:13px;font-weight:600}
.strip .s-val{font-size:24px;font-weight:700}
.strip .s-val small{font-size:12px;opacity:.7}
.strip.green{background:#eaf7f1;color:#137a52}
.strip.green .s-val{color:var(--green)}
/* แถบสรุปพัฒนาการ: ก่อน → หลัง พร้อม % ของคะแนนเต็ม */
.strip.gain{align-items:center;padding:13px 15px;gap:13px}
.gain-body{flex:1;min-width:0}
.gain-body .s-lb{font-size:12.5px;font-weight:600;opacity:.9}
.gain-arrow{font-size:21px;font-weight:700;line-height:1.2;margin-top:2px;color:#0f6b47;
  font-variant-numeric:tabular-nums}
.gain-arrow .ar{margin:0 7px;color:#5cae8c;font-weight:600}
.gain-note{font-size:11.5px;margin-top:3px;opacity:.9;line-height:1.5}
.gain-note .sep{opacity:.45;margin:0 3px}
.note-box{background:#f7f9fc;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;
  font-size:12.5px;color:#42536b;margin-top:14px}
.note-box b{color:var(--blue)}

/* lists */
.ol{list-style:none;margin:0;padding:0;counter-reset:n}
.ol li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.ol li:last-child{border-bottom:0}
.ol li::before{counter-increment:n;content:counter(n);flex:0 0 18px;color:var(--blue);font-weight:700;font-size:12px}
.ul{list-style:none;margin:0;padding:0}
.ul li{position:relative;padding:6px 0 6px 17px;font-size:13px}
.ul li::before{content:"◆";position:absolute;left:0;top:6px;color:var(--amber);font-size:9px}
.ul.check li::before{content:"●";color:var(--blue-2);font-size:8px;top:8px}
.hd-line{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);
  font-size:13.5px;margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line-2)}
.hd-line .tick{color:var(--green)}
.policy{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.policy li{display:flex;gap:10px;font-size:12.8px;color:#dce7f4;line-height:1.5;list-style:none}
.policy li b{color:var(--blue-soft);font-size:11px;font-weight:700;flex:0 0 16px;padding-top:1px}
.policy li b.n{font-variant-numeric:tabular-nums}
.dark-note{margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.14);
  font-size:12px;color:#a9c0dc;line-height:1.6}
.footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
/* บนจอ โลโก้ KX อยู่ในแถบเมนูซ้าย — ท้ายหน้าจะโชว์เฉพาะตอนพิมพ์ (เพราะเมนูถูกซ่อน) */
.footer .fl{margin-left:auto;display:none;align-items:center;gap:18px}
.footer img{height:30px;width:auto;opacity:.9}
.footer img.km{height:42px;transform:translateY(-4px)}   /* ยกให้ฐานตรงกับโลโก้อื่นบนกระดาษ */
.footer img.kxb{height:38px}
.footer .vr{width:1px;height:22px;background:var(--line)}

/* ---------- KPI ---------- */
.kpi-hero{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px 22px;
  margin-bottom:16px;box-shadow:var(--shadow)}
.kpi-hero-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:13px}
.kpi-hero-lb{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-soft);font-weight:600}
.kpi-hero-num{font-size:34px;font-weight:700;line-height:1}
.kpi-hero-num small{font-size:15px;color:#a9c0dc;font-weight:600}
.kpi-hero-pct{margin-left:auto;font-size:26px;font-weight:700}
.kpi-hero-sub{font-size:12px;color:#a9c0dc;margin-top:5px}
.kpi-track{height:12px;border-radius:7px;background:rgba(255,255,255,.16);overflow:hidden;position:relative}
.kpi-track>span{display:block;height:100%;border-radius:7px;background:var(--blue-2);
  transition:width .95s cubic-bezier(.25,.9,.25,1);transition-delay:var(--d,0ms)}
.kpi-track.over>span{background:#37c08a}
.kpi-mini{margin-top:11px;padding-top:11px;border-top:1px solid var(--line-2)}
.kpi-mini-top{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.kpi-mini-top b{color:var(--navy);font-size:12.5px}
.kpi-mini-top .pc{margin-left:auto;font-weight:700;color:var(--blue)}
.kpi-mini-top .pc.over{color:var(--green)}
.kpi-mini-track{height:6px;border-radius:4px;background:var(--track);overflow:hidden}
.kpi-mini-track>span{display:block;height:100%;border-radius:4px;background:var(--blue);
  transition:width .85s cubic-bezier(.25,.9,.25,1);transition-delay:var(--d,0ms)}
.kpi-mini-track.over>span{background:var(--green)}
.kpi-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:10.5px;font-weight:700}
.kpi-badge.over{background:#eaf7f1;color:#137a52}
.kpi-badge.under{background:#eef3fa;color:var(--navy-2)}
.kpi-badge.none{background:var(--track);color:var(--muted)}

/* ---------- overview tables/cards ---------- */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.ov-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px;
  box-shadow:var(--shadow);cursor:pointer;transition:.15s;text-align:left;display:block;width:100%}
.ov-card:hover{border-color:var(--blue-soft);transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(18,50,92,.09)}
.ov-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px}
.ov-num{flex:0 0 26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;
  font-size:12px;font-weight:700;display:grid;place-items:center}
.ov-name{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.4}
.ov-prov{font-size:11.5px;color:var(--muted);margin-top:3px}
.ov-stats{display:flex;gap:0;border-top:1px solid var(--line-2);padding-top:11px}
.ov-st{flex:1;border-left:1px solid var(--line-2);padding-left:11px}
.ov-st:first-child{border-left:0;padding-left:0}
.ov-sv{font-size:17px;font-weight:700;color:var(--navy)}
.ov-sv.muted{color:var(--track)}
.ov-sv.pos{color:var(--green)}
.ov-sl{font-size:10.5px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600}
.tag-ok{background:#eaf7f1;color:#137a52}
.tag-none{background:var(--track);color:var(--muted)}

.empty{background:#fff;border:1px dashed var(--blue-soft);border-radius:var(--radius);
  padding:44px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--navy);margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;font-size:13px}

.bt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.bt-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;
  cursor:pointer;text-align:left;transition:.15s}
.bt-card:hover{border-color:var(--blue-soft);background:#fbfcfe}
.bt-name{font-weight:700;color:var(--navy);font-size:13.5px}
.bt-date{font-size:11.5px;color:var(--muted);margin-top:2px;min-height:17px}
.bt-nums{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.bt-n{font-size:15px;font-weight:700;color:var(--navy)}
.bt-n.pos{color:var(--green)}
.bt-l{font-size:10.5px;color:var(--muted)}

/* ---------- modal / editor ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,38,64,.42);backdrop-filter:blur(2px);
  display:none;z-index:60;align-items:flex-start;justify-content:center;padding:26px}
.overlay.show{display:flex}
.modal{background:var(--bg);width:100%;max-width:900px;max-height:calc(100vh - 52px);
  border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(10,25,45,.3)}
.modal-h{background:#fff;padding:16px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px}
.modal-h h3{margin:0;font-size:16px;color:var(--navy)}
.modal-h .sub{font-size:12px;color:var(--muted)}
.modal-b{flex:1;overflow-y:auto;padding:18px 20px}
.modal-f{background:#fff;padding:13px 20px;border-top:1px solid var(--line);
  display:flex;gap:9px;align-items:center}
.fs{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:14px}
.fs-h{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;
  align-items:center;gap:8px}
.fs-h span{font-size:11px;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:13px;
  width:100%;outline:none;transition:.12s}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,189,.1)}
.f textarea{resize:vertical;min-height:56px;line-height:1.5}
.lrow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.lrow input[type=text]{flex:1}
.lrow input.n{flex:0 0 78px;text-align:right}
.lrow .x{flex:0 0 26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;
  color:#b04a3c;display:grid;place-items:center;font-size:14px;line-height:1}
.lrow .x:hover{background:#fdf3f2;border-color:#e8b9b2}
.lhead{display:flex;gap:8px;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.05em}
.lhead .a{flex:1}.lhead .b{flex:0 0 78px;text-align:right}.lhead .c{flex:0 0 26px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(10,25,45,.28);opacity:0;transition:.28s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6}
.sep{height:1px;background:var(--line);margin:14px 0}

/* import preview */
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;padding:0 8px 7px 0;font-weight:600;border-bottom:1px solid var(--line)}
.ptab td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.ptab td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy)}
.ptab td.g{color:var(--green)}
.warn{background:#fff8ec;border:1px solid #f0dcb6;border-radius:10px;padding:11px 13px;
  font-size:12.5px;color:#7a5a1f;margin-bottom:14px}
.warn b{color:#a06a10}
.ok-box{background:#eef8f3;border:1px solid #c6e6d8;border-radius:10px;padding:11px 13px;
  font-size:12.5px;color:#14664a;margin-bottom:14px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;background:#fff;margin-bottom:9px;cursor:pointer}
.chk input{margin-top:3px}
.chk .t{font-size:12.5px;font-weight:600}
.chk .d{font-size:11.5px;color:var(--muted)}
.unused{font-size:11.5px;color:var(--muted);line-height:1.8}
.unused span{display:inline-block;background:var(--track);border-radius:5px;padding:1px 7px;margin:0 4px 4px 0}
.rawtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rawtab{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:12px;font-weight:600;color:var(--muted)}
.rawtab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rawlist{list-style:none;margin:0;padding:0}
.rawlist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.rawlist .i{flex:0 0 22px;color:var(--muted);font-size:11px;padding-top:2px;font-variant-numeric:tabular-nums}
.rawlist .tx{flex:1}
.rawlist .add{flex:0 0 auto;padding:3px 9px;font-size:11px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--blue);font-weight:600}
.rawlist .add:hover{background:#eff5fc;border-color:var(--blue-soft)}
.rawlist .add.done{color:var(--green);border-color:#c6e6d8;background:#eef8f3}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--blue-soft);
  border-top-color:var(--navy);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- MOVEMENT ---------- */
.anim-in{opacity:0;transform:translateY(14px);
  animation:rise .5s cubic-bezier(.22,.9,.3,1) forwards;animation-delay:var(--d,0ms)}
@keyframes rise{to{opacity:1;transform:none}}
.bar>span,.sk-after,.sk-before,.gender>div{
  transition:width .85s cubic-bezier(.25,.9,.25,1);transition-delay:var(--d,0ms)}
.card{transition:box-shadow .2s,transform .2s}
.card[data-replay]{cursor:pointer}
.card[data-replay]:hover{box-shadow:0 10px 30px rgba(18,50,92,.1)}
.card[data-replay]:active{transform:scale(.995)}
.row{transition:transform .18s}
.row:hover{transform:translateX(2px)}
.row:hover .bar>span{filter:brightness(1.08)}
.bar>span{position:relative;overflow:hidden}
.bar>span::after{content:"";position:absolute;inset:0;border-radius:4px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-100%)}
.playing .bar>span::after{animation:sheen 1.1s ease-out var(--d,0ms)}
@keyframes sheen{to{transform:translateX(200%)}}
.pop{animation:pop .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.11)}100%{transform:scale(1)}}
.replay-btn{margin-left:auto;border:0;background:none;color:var(--muted);font-size:15px;
  line-height:1;padding:2px 4px;border-radius:6px;opacity:0;transition:.15s}
.card:hover .replay-btn{opacity:1}
.replay-btn:hover{background:var(--bg);color:var(--blue);transform:rotate(-40deg)}
.card.dark .replay-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.gauge{flex:0 0 46px;width:46px;height:46px;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:5;stroke-linecap:round}
.gauge .g-bg{stroke:rgba(255,255,255,.2)}
.gauge .g-fg{stroke:#fff;stroke-dasharray:126;stroke-dashoffset:126;
  transition:stroke-dashoffset 1.1s cubic-bezier(.25,.9,.25,1) 150ms}
.strip.green .gauge .g-bg{stroke:#cbe8dc}
.strip.green .gauge .g-fg{stroke:var(--green)}
.batch-list{transition:max-height .28s ease,opacity .2s;overflow:hidden}
.ov-card,.bt-card{transition:transform .18s,box-shadow .18s,border-color .18s}
.ov-card:active,.bt-card:active{transform:scale(.99)}
.pill,.kpi-val,.big-num,.s-val{transition:transform .2s}
.cnt-row:hover .pill{transform:scale(1.09)}
.skill:hover .sk-after{filter:brightness(1.05)}
.main{animation:fadein .32s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  *,*::after{animation:none !important;transition:none !important}
  .anim-in{opacity:1;transform:none}
}

/* ---------- responsive ---------- */
@media(max-width:1300px){
  .grid>[data-span="3"]{grid-column:span 6}
  .grid>[data-span="4"]{grid-column:span 6}
  .grid>[data-span="5"]{grid-column:span 6}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .side-scroll{max-height:320px}
  .main{padding:18px 16px 50px}
  .grid>*{grid-column:span 12 !important}
  .kpi-row{margin-left:0;width:100%;overflow-x:auto}
  .kpi{padding:0 16px}.kpi:first-child{padding-left:0}
  .policy{grid-template-columns:1fr}
  .page-title{font-size:20px}
}
@media print{
  /* ปิดอนิเมชันตอนพิมพ์ เพื่อไม่ให้การ์ดหรือแถบหายไปจากกระดาษ */
  .anim-in,.main{opacity:1 !important;transform:none !important;animation:none !important}
  /* กระดาษไม่มีเมาส์ให้ชี้ — แสดงชื่อหัวข้อเต็มเสมอ */
  .lbl{display:block !important;-webkit-line-clamp:unset !important;overflow:visible !important}
  .lbl-btn{display:none !important}
  .replay-btn{display:none !important}
  .sidebar,.head-actions,.no-print{display:none !important}
  .footer .fl{display:flex !important}   /* คืนโลโก้ KX ท้ายหน้ากระดาษ */
  body{background:#fff}
  .main{padding:0}
  .card{break-inside:avoid;box-shadow:none}
  .grid{gap:10px}
}

function buildDefault(){
  const courses = COURSE_DEFS.map((c,i)=>{
    const bs=[];
    for(let k=1;k<=c.batches;k++) bs.push(emptyBatch(k,c.kpi));
    if(i===0) bs[0]=JSON.parse(JSON.stringify(MAHIDOL_B1));
    return {id:"c"+(i+1), name:c.name, nameEn:c.nameEn, provider:c.provider, short:c.short, batches:bs};
  });
  return {version:1, org:"KX Knowledge Xchange · มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าธนบุรี (มจธ.)", courses};
}

const KEY="boi_stem_dashboard_v1";
/* โหมดดูอย่างเดียว — ใช้กับไฟล์ที่ส่งออกไปขึ้นเว็บ (ซ่อนปุ่มแก้ไข/นำเข้า/ลบทั้งหมด)
   ต้องประกาศก่อน load() ถูกเรียก */
const VIEWONLY = !!window.__VIEWONLY__;
if(VIEWONLY) document.documentElement.classList.add("is-viewonly");
let DATA = load();
let view = {type:"home", ci:0, bi:0};
let openCourses = new Set([0]);

/* เติมค่า KPI ให้ข้อมูลที่บันทึกไว้ก่อนหน้า (ตอนนั้นยังไม่มีฟิลด์นี้) */
function migrate(d){
  if(!d||!d.courses) return d;
  d.courses.forEach((c,i)=>{
    const def=COURSE_DEFS[i];
    c.batches.forEach(b=>{
      if(b.kpiTarget===undefined) b.kpiTarget = def?(+def.kpi||0):0;
      if(b.attendees===undefined) b.attendees = 0;
    });
  });
  return d;
}
function load(){
  /* ไฟล์ขึ้นเว็บต้องแสดงข้อมูลที่ฝังมาเสมอ ไม่สนใจข้อมูลค้างในเบราว์เซอร์ผู้ชม */
  if(VIEWONLY && window.__PRESET__ && window.__PRESET__.courses) return migrate(window.__PRESET__);
  let stored=null;
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); if(d&&d.courses&&d.courses.length) stored=d; }
  }catch(e){}
  /* ไฟล์นำเสนอ (ส่งออกแบบฝังข้อมูล) — ใช้ข้อมูลที่ฝังมา ถ้าใหม่กว่าที่ค้างในเครื่องนั้น */
  const preset=window.__PRESET__;
  if(preset&&preset.courses&&preset.courses.length){
    if(!stored || (preset.exportedAt||"") > (stored.savedAt||"")) return migrate(preset);
  }
  return migrate(stored)||buildDefault();
}
function save(){
  DATA.savedAt=new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){ toast("บันทึกไม่สำเร็จ (พื้นที่เต็ม)"); }
}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2100);
}

/* helpers */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n1 = v => (Math.round(v*10)/10).toFixed(1);
const n2 = v => (Math.round(v*100)/100).toFixed(2);
const hasData = b => (b.respondents>0) || (b.satisfaction&&b.satisfaction.length>0);
const avgSat = b => b.satisfaction&&b.satisfaction.length ? b.satisfaction.reduce((s,x)=>s+(+x.value||0),0)/b.satisfaction.length : 0;
const avgGain = b => b.skills&&b.skills.length ? b.skills.reduce((s,x)=>s+((+x.after||0)-(+x.before||0)),0)/b.skills.length : 0;
const avgBefore = b => b.skills&&b.skills.length ? b.skills.reduce((s,x)=>s+(+x.before||0),0)/b.skills.length : 0;
const avgAfter  = b => b.skills&&b.skills.length ? b.skills.reduce((s,x)=>s+(+x.after||0),0)/b.skills.length : 0;
const SCALE_MAX = 5;                              /* มาตราส่วนคะแนนเต็มของแบบประเมิน */
/* พัฒนาการคิดเป็น % ของคะแนนเต็ม = คะแนนที่เพิ่มขึ้น ÷ 5 × 100
   (ไม่เทียบกับคะแนนก่อนอบรม เพราะจะได้ค่าเกิน 100% ในรุ่นที่พื้นฐานต่ำ) */
const pctOfScale = gain => gain/SCALE_MAX*100;
const gainPct = b => pctOfScale(avgGain(b));

/* ---- KPI ----
   เป้าหมาย = kpiTarget ของทุกรุ่น (รวมรุ่นที่ยังไม่จัด)
   ทำได้    = จำนวนผู้เข้าอบรมจริง ถ้าไม่ได้กรอกจะใช้จำนวนผู้ตอบแบบประเมินแทน */
const kpiTargetOf = b => +b.kpiTarget||0;
const attendeesOf = b => (+b.attendees>0 ? +b.attendees : (+b.respondents||0));
function kpiOf(batches){
  const target=batches.reduce((s,b)=>s+kpiTargetOf(b),0);
  const actual=batches.reduce((s,b)=>s+attendeesOf(b),0);
  return {target, actual, pct: target? actual/target*100 : 0};
}
const fmt = n => String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,",");

function courseStats(c){
  const done=c.batches.filter(hasData);
  const resp=done.reduce((s,b)=>s+(+b.respondents||0),0);
  /* เฉลี่ยเฉพาะรุ่นที่มีผลประเมินจริง — รุ่นที่กรอกแค่จำนวนคนต้องไม่ถูกนับเป็นคะแนน 0 */
  const wSat=c.batches.filter(b=>b.satisfaction&&b.satisfaction.length);
  const wSkill=c.batches.filter(b=>b.skills&&b.skills.length);
  const sat=wSat.length?wSat.reduce((s,b)=>s+avgSat(b),0)/wSat.length:0;
  const gain=wSkill.length?wSkill.reduce((s,b)=>s+avgGain(b),0)/wSkill.length:0;
  const before=wSkill.length?wSkill.reduce((s,b)=>s+avgBefore(b),0)/wSkill.length:0;
  const after=wSkill.length?wSkill.reduce((s,b)=>s+avgAfter(b),0)/wSkill.length:0;
  return {total:c.batches.length, done:done.length, resp, sat, gain, before, after,
    gainPct:pctOfScale(gain), kpi:kpiOf(c.batches)};
}
function allStats(){
  let resp=0,done=0,total=0,sats=[],gains=[],befores=[],afters=[],all=[];
  DATA.courses.forEach(c=>{const s=courseStats(c);resp+=s.resp;done+=s.done;total+=s.total;
    all=all.concat(c.batches);
    if(s.sat) sats.push(s.sat);
    if(s.gain){ gains.push(s.gain); befores.push(s.before); afters.push(s.after); }});
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const gain=mean(gains), before=mean(befores), after=mean(afters);
  return {resp,done,total,kpi:kpiOf(all),
    sat:mean(sats), gain, before, after,
    gainPct:pctOfScale(gain)};
}

/* =====================================================================
   2.5) ระบบอนิเมชัน — แถบวิ่ง · ตัวเลขนับขึ้น · การ์ดไล่ปรากฏ
   ===================================================================== */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ตัวเลขนับขึ้น: <span data-count="4.48" data-dec="2" data-pre="+">…</span> */
function cnt(value,dec=0,pre="",post="",cls=""){
  const p=Math.pow(10,dec);
  value=Math.round((+value||0)*p)/p;          /* ปัดให้ตรงกับตัวเลขที่แสดงทุกที่ */
  const shown=value.toFixed(dec);
  return `<span class="num ${cls}" data-count="${value}" data-dec="${dec}"
    data-pre="${esc(pre)}" data-post="${esc(post)}">${pre}${shown}${post}</span>`;
}
/* แถบ: width เริ่มที่ 0 แล้วค่อยวิ่งไปที่ data-w */
function barSpan(pct,extra=""){
  return `<span style="width:0" data-w="${Math.max(0,Math.min(100,+pct||0))}" ${extra}></span>`;
}
function easeOut(t){ return 1-Math.pow(1-t,3); }

function runCounters(root,delayBase=0){
  root.querySelectorAll("[data-count]").forEach((el,i)=>{
    const target=+el.dataset.count, dec=+el.dataset.dec||0;
    const pre=el.dataset.pre||"", post=el.dataset.post||"";
    if(REDUCED){ el.textContent=pre+target.toFixed(dec)+post; return; }
    const dur=800, delay=delayBase+i*35;
    el.textContent=pre+(0).toFixed(dec)+post;
    const t0=performance.now()+delay;
    let done=false;
    const finish=()=>{ if(done) return; done=true;
      el.textContent=pre+target.toFixed(dec)+post;
      if(el.closest(".kpi-val")) el.classList.add("pop"); };
    const step=now=>{
      if(done) return;
      const p=Math.min(1,Math.max(0,(now-t0)/dur));
      el.textContent=pre+(target*easeOut(p)).toFixed(dec)+post;
      if(p<1) requestAnimationFrame(step); else finish();
    };
    requestAnimationFrame(step);
    /* กันกรณีเปิดไว้ในแท็บพื้นหลัง (rAF ถูกหยุด) — บังคับให้ตัวเลขถูกต้องเสมอ */
    setTimeout(finish,delay+dur+700);
  });
}
function runBars(root,delayBase=0){
  const els=[...root.querySelectorAll("[data-w]")];
  els.forEach((el,i)=>{
    const w=el.dataset.w+"%";
    if(REDUCED){ el.style.width=w; return; }
    /* แถบ "หลังอบรม" วิ่งตามหลังแถบ "ก่อนอบรม" เพื่อให้เห็นการเติบโต */
    el.style.setProperty("--d",(delayBase+i*55+(el.hasAttribute("data-slow")?380:0))+"ms");
    /* setTimeout ทำงานแม้อยู่ในแท็บพื้นหลัง — ค่าปลายทางจึงถูกต้องเสมอ */
    setTimeout(()=>{ el.style.width=w; },30);
  });
  root.querySelectorAll(".g-fg").forEach(c=>{
    const p=+c.dataset.p||0;
    if(REDUCED){ c.style.strokeDashoffset=126*(1-p); return; }
    c.style.strokeDashoffset=126;
    setTimeout(()=>{ c.style.strokeDashoffset=126*(1-p); },30);
  });
  if(!REDUCED){
    root.classList.add("playing");
    setTimeout(()=>root.classList.remove("playing"),1600+els.length*55);
  }
}
function animateIn(root){
  if(!REDUCED){
    root.querySelectorAll(".card,.ov-card,.bt-card").forEach((el,i)=>{
      el.style.setProperty("--d",Math.min(i*55,600)+"ms");
      el.classList.add("anim-in");
    });
  }
  runBars(root,120); runCounters(root,120);
}
/* คลิกการ์ด = เล่นซ้ำ */
function replayCard(card){
  card.querySelectorAll("[data-w]").forEach(el=>el.style.width="0");
  card.querySelectorAll(".g-fg").forEach(c=>c.style.strokeDashoffset=126);
  card.querySelectorAll("[data-count]").forEach(el=>{
    el.textContent=(el.dataset.pre||"")+(0).toFixed(+el.dataset.dec||0)+(el.dataset.post||"");
  });
  card.classList.remove("pop");
  setTimeout(()=>{ runBars(card,0); runCounters(card,0); },30);
}
function replayAll(){
  const m=document.getElementById("main");
  m.querySelectorAll(".card").forEach((c,i)=>setTimeout(()=>replayCard(c),i*90));
  runCounters(m.querySelector(".kpi-row")||m,0);
}

function renderNav(){
  document.getElementById("navHome").classList.toggle("active", view.type==="home");
  const box=document.getElementById("navCourses");
  box.innerHTML = DATA.courses.map((c,ci)=>{
    const st=courseStats(c);
    const open=openCourses.has(ci);
    const batches=c.batches.map((b,bi)=>{
      const on = view.type==="batch"&&view.ci===ci&&view.bi===bi;
      const hd = hasData(b);
      return `<button class="batch-btn ${on?"active":""} ${hd?"has-data":""}" data-c="${ci}" data-b="${bi}">
        <span class="dot"></span><span>${esc(b.name)}</span>
        ${hd?`<span class="batch-score num">${n2(avgSat(b))}</span>`:""}
      </button>`;
    }).join("");
    return `<div class="course-item">
      <button class="course-btn ${view.type==="course"&&view.ci===ci?"active":""}" data-c="${ci}">
        <span class="caret ${open?"open":""}">▶</span>
        <span class="course-idx">${ci+1}</span>
        <span class="course-name">${esc(c.short||c.name)}
          <span class="course-meta">${st.total} รุ่น · มีข้อมูล ${st.done}</span>
        </span>
      </button>
      <div class="batch-list ${open?"open":""}">${batches}</div>
    </div>`;
  }).join("");

  box.querySelectorAll(".course-btn").forEach(el=>{
    el.onclick=(e)=>{
      const ci=+el.dataset.c;
      if(e.target.classList.contains("caret")){ toggleOpen(ci); return; }
      openCourses.add(ci); view={type:"course",ci,bi:0}; render();
    };
  });
  box.querySelectorAll(".batch-btn").forEach(el=>{
    el.onclick=()=>{ view={type:"batch",ci:+el.dataset.c,bi:+el.dataset.b}; render(); };
  });
}
function toggleOpen(ci){ openCourses.has(ci)?openCourses.delete(ci):openCourses.add(ci); renderNav(); }

function rowBar(label,value,unit,cls){
  return `<div class="row">
    <div class="row-top">${lbl(label)}
      <span class="row-val">${cnt(value,0,"",unit||"")}</span></div>

/* ชื่อหัวข้อ: แสดง 2 บรรทัด ถ้ายาวเกินจะมีป้ายเต็มตอนชี้เมาส์ (ดู markClamped) */
function lbl(text,cls){
  return `<span class="${cls||"row-lb"} tipwrap" data-full="${esc(text)}"
    ><span class="lbl">${esc(text)}</span></span>`;
}
/* ติดธง is-clamped เฉพาะหัวข้อที่ถูกตัดจริง ป้ายจะได้ไม่เด้งมั่ว */
function markClamped(root){
  root.querySelectorAll(".tipwrap").forEach(w=>{
    const el=w.querySelector(".lbl");
    w.classList.toggle("is-clamped", !!el && el.scrollHeight>el.clientHeight+1);
  });
}

function bindPage(){
  const q=id=>document.getElementById(id);
  /* คลิกที่การ์ด (หรือปุ่ม ↻) = ให้กราฟวิ่งใหม่ */
  document.querySelectorAll(".card[data-replay]").forEach(card=>{
    card.onclick=e=>{ if(e.target.closest("button")&&!e.target.closest(".replay-btn")) return;
      replayCard(card); };
  });
  /* ปุ่ม ⤢ = กางชื่อหัวข้อเต็มทั้งการ์ด (ใช้ได้ทั้งจอสัมผัสที่ชี้เมาส์ไม่ได้) */
  document.querySelectorAll(".lbl-btn").forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const card=btn.closest(".card");
      card.classList.toggle("labels-full");
      markClamped(card);
    };
  });
  if(q("replayAll")) q("replayAll").onclick=replayAll;
  /* คลิกที่แถบเดี่ยว = วิ่งเฉพาะแถบนั้น */
  document.querySelectorAll(".row,.skill").forEach(r=>{
    r.addEventListener("click",e=>{
      e.stopPropagation();
      r.querySelectorAll("[data-w]").forEach(el=>el.style.width="0");
      r.querySelectorAll("[data-count]").forEach(el=>{
        el.textContent=(el.dataset.pre||"")+(0).toFixed(+el.dataset.dec||0)+(el.dataset.post||"");});
      setTimeout(()=>{ runBars(r,0); runCounters(r,0); },20);
    });
  });
  document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{
    const ci=+el.dataset.go; openCourses.add(ci); view={type:"course",ci,bi:0}; render(); });
  document.querySelectorAll(".bt-card").forEach(el=>el.onclick=()=>{
    view={type:"batch",ci:view.ci,bi:+el.dataset.b}; render(); });
  if(q("editBatch")) q("editBatch").onclick=openBatchEditor;
  if(q("editBatch2")) q("editBatch2").onclick=openBatchEditor;
  if(q("importRaw")) q("importRaw").onclick=startImport;
  if(q("importRaw2")) q("importRaw2").onclick=startImport;
  if(q("rawView")) q("rawView").onclick=openRawViewer;
  if(q("editCourse")) q("editCourse").onclick=openCourseEditor;
  if(q("addBatch")) q("addBatch").onclick=()=>{
    const c=DATA.courses[view.ci];
    /* รุ่นใหม่ใช้ KPI ต่อรุ่นเท่ากับรุ่นก่อนหน้าของหลักสูตรเดียวกัน */
    const kpi=(COURSE_DEFS[view.ci]||{}).kpi ?? kpiTargetOf(c.batches[c.batches.length-1]||{});
    c.batches.push(emptyBatch(c.batches.length+1,kpi)); save();
    view={type:"batch",ci:view.ci,bi:c.batches.length-1}; render(); toast("เพิ่มรุ่นแล้ว");
  };
  if(q("delBatch")) q("delBatch").onclick=()=>{
    const c=DATA.courses[view.ci];
    if(c.batches.length<=1){ toast("ต้องมีอย่างน้อย 1 รุ่น"); return; }
    if(!confirm("ลบ "+c.batches[view.bi].name+" ? ข้อมูลทั้งหมดของรุ่นนี้จะหายไป")) return;
    c.batches.splice(view.bi,1); save(); view={type:"course",ci:view.ci,bi:0}; render(); toast("ลบรุ่นแล้ว");
  };
}

let draft=null;
/* ตัวปิดหน้าต่างที่กำลังเปิดอยู่ (ให้ปุ่ม Esc เรียกใช้ตัวเดียวกัน) */
let modalClose=null;
/* true เมื่อผู้ใช้เริ่มพิมพ์/แก้ไข — ใช้เตือนก่อนปิดโดยไม่ได้บันทึก */
let modalDirty=false;

function openModal(html,onSave,title,sub){
  const ov=document.getElementById("overlay"), md=document.getElementById("modal");
  md.innerHTML=`
    <div class="modal-h"><div style="flex:1"><h3>${esc(title)}</h3><div class="sub">${esc(sub||"")}</div></div>
      <button class="btn btn-ghost" id="mClose">✕</button></div>
    <div class="modal-b" id="mBody">${html}</div>
    <div class="modal-f"><button class="btn btn-primary" id="mSave">บันทึกข้อมูล</button>
      <button class="btn" id="mCancel">ยกเลิก</button>
      <span class="hint" style="margin-left:auto">บันทึกอัตโนมัติลงเบราว์เซอร์เครื่องนี้</span></div>`;
  ov.classList.add("show");
  modalDirty=false;

  /* ปิดหน้าต่าง — ถ้าแก้ไขค้างไว้ ต้องยืนยันก่อน กันข้อมูลที่พิมพ์หายโดยไม่ตั้งใจ */
  const close=(force)=>{
    if(!force && modalDirty &&
       !confirm("ยังไม่ได้บันทึกสิ่งที่แก้ไข\nถ้าปิดตอนนี้ ข้อความที่พิมพ์ไว้จะหายไปทั้งหมด\n\nต้องการปิดหน้าต่างนี้หรือไม่?")) return;
    ov.classList.remove("show"); draft=null; modalClose=null; modalDirty=false;
  };
  modalClose=close;
  md.querySelector("#mClose").onclick=()=>close();
  md.querySelector("#mCancel").onclick=()=>close();
  md.querySelector("#mSave").onclick=()=>{ onSave(); save(); close(true); render(); toast("บันทึกเรียบร้อย"); };
  /* คลิกพื้นหลังไม่ปิดหน้าต่างอีกต่อไป — ต้องกด ✕ หรือ ยกเลิก เท่านั้น */
  ov.onclick=null;
}
function setPath(obj,path,val){
  const ks=path.split("."); let o=obj;
  for(let i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}
function getPath(obj,path){ return path.split(".").reduce((o,k)=>o?.[k], obj); }

function fld(path,label,type,ph){
  const v=getPath(draft,path);
  if(type==="textarea") return `<div class="f"><label>${esc(label)}</label>
    <textarea data-p="${path}" placeholder="${esc(ph||"")}">${esc(v??"")}</textarea></div>`;
  return `<div class="f"><label>${esc(label)}</label>
    <input data-p="${path}" type="${type==="num"?"number":"text"}" ${type==="num"?'step="0.01"':""}
      value="${esc(v??"")}" placeholder="${esc(ph||"")}"></div>`;
}

function wireEditor(){
  const body=document.getElementById("mBody");
  body.oninput=e=>{
    const p=e.target.dataset.p; if(!p) return;
    let v=e.target.value;
    if(e.target.type==="number") v = v===""?0:parseFloat(v);
    setPath(draft,p,v);
    modalDirty=true;                       /* มีการแก้ไขค้างอยู่ */
  };
  body.onclick=e=>{
    const add=e.target.dataset.add, del=e.target.dataset.del;
    if(add){
      const [path,kind]=add.split("|"); const arr=getPath(draft,path);
      arr.push(kind==="lv"?{label:"",value:0}:kind==="ba"?{label:"",before:0,after:0}:"");
      redrawList(path,kind); modalDirty=true; return;
    }
    if(del){
      const [path,i]=del.split("|"); const arr=getPath(draft,path);
      const kind=body.querySelector(`[data-list="${path}"]`).dataset.kind;
      arr.splice(+i,1); redrawList(path,kind); modalDirty=true; return;
    }
  };
}
function redrawList(path,kind){
  const holder=document.querySelector(`[data-list="${path}"]`);
  const arr=getPath(draft,path)||[];
  holder.innerHTML=arr.map((it,i)=>{
    if(kind==="lv") return `<div class="lrow"><input type="text" data-p="${path}.${i}.label" value="${esc(it.label)}">
      <input class="n" type="number" step="0.01" data-p="${path}.${i}.value" value="${esc(it.value)}">
      <button class="x" data-del="${path}|${i}">×</button></div>`;
    if(kind==="ba") return `<div class="lrow"><input type="text" data-p="${path}.${i}.label" value="${esc(it.label)}">
      <input class="n" type="number" step="0.01" data-p="${path}.${i}.before" value="${esc(it.before)}">
      <input class="n" type="number" step="0.01" data-p="${path}.${i}.after" value="${esc(it.after)}">
      <button class="x" data-del="${path}|${i}">×</button></div>`;
    return `<div class="lrow"><input type="text" data-p="${path}.${i}" value="${esc(it)}">
      <button class="x" data-del="${path}|${i}">×</button></div>`;
  }).join("");
}

/* =====================================================================
   6) นำเข้าข้อมูลดิบจากแบบประเมิน (.xlsx / .csv)
      — ทำงานในเครื่องทั้งหมด ไฟล์ไม่ถูกส่งออกไปไหน
      — ไม่เก็บข้อมูลส่วนบุคคล (ชื่อ / เลขบัตร / อีเมล / เบอร์โทร)
   ===================================================================== */

/* ---- 6.1 อ่านไฟล์ xlsx (unzip ด้วย DecompressionStream ของเบราว์เซอร์) ---- */
async function inflateRaw(u8){
  if(typeof DecompressionStream==="undefined") throw new Error("NO_DS");
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), files={};
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error("BAD_ZIP");
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true);
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true);
    const start=lho+30+lnl+lel;
    files[name]={method, data:u8.subarray(start,start+csize)};
    p+=46+nlen+elen+clen;
  }
  return files;
}
async function readXlsx(file){
  const files=await unzip(await file.arrayBuffer());
  const get=async name=>{
    const f=files[name]; if(!f) return null;
    const raw=f.method===0?f.data:await inflateRaw(f.data);
    return new TextDecoder("utf-8").decode(raw);
  };
  const P=new DOMParser();
  const ssXml=await get("xl/sharedStrings.xml"); const ss=[];
  if(ssXml){
    const doc=P.parseFromString(ssXml,"application/xml");
    doc.querySelectorAll("si").forEach(si=>{
      let s=""; si.querySelectorAll("t").forEach(t=>s+=t.textContent); ss.push(s);
    });
  }
  let sheetName="xl/worksheets/sheet1.xml";
  const names=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))
    .sort((a,b)=>(+a.match(/\d+/)[0])-(+b.match(/\d+/)[0]));
  if(names.length) sheetName=names[0];
  const shXml=await get(sheetName);
  if(!shXml) throw new Error("NO_SHEET");
  const doc=P.parseFromString(shXml,"application/xml");
  const colIdx=ref=>{const m=/^([A-Z]+)/.exec(ref); let x=0;
    for(const ch of m[1]) x=x*26+ch.charCodeAt(0)-64; return x-1;};
  const rows=[];
  doc.querySelectorAll("sheetData > row").forEach(row=>{
    const cells=[]; let max=-1;
    row.querySelectorAll("c").forEach(c=>{
      const i=colIdx(c.getAttribute("r")||"A1"), t=c.getAttribute("t");
      let v="";
      if(t==="s"){ const vn=c.querySelector("v"); v=vn?(ss[+vn.textContent]||""):""; }
      else if(t==="inlineStr"){ c.querySelectorAll("is t").forEach(x=>v+=x.textContent); }
      else { const vn=c.querySelector("v"); v=vn?vn.textContent:""; }
      cells[i]=v; if(i>max) max=i;
    });
    for(let i=0;i<=max;i++) if(cells[i]===undefined) cells[i]="";
    if(cells.some(x=>String(x).trim()!=="")) rows.push(cells);
  });
  return rows;
}
/* ---- 6.2 อ่าน CSV ---- */
function readCsvText(text){
  text=text.replace(/^﻿/,"");
  const head=text.slice(0,3000);
  const d=[[",",(head.match(/,/g)||[]).length],[";",(head.match(/;/g)||[]).length],
           ["\t",(head.match(/\t/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===d){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(ch!=="\r") cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}

/* ---- 6.3 ตัวช่วยจัดกลุ่มคำตอบ ---- */
const norm = s => String(s??"").replace(/\s+/g," ").trim();
const numOf = v => { const x=parseFloat(String(v).replace(/,/g,"")); return isFinite(x)?x:null; };

  [/ขอนแก่น|มข\.|khon\s*kaen/i,"ม.ขอนแก่น"],
  [/สงขลานครินทร์|ม\.อ\.|prince of songkla|psu/i,"ม.สงขลานครินทร์"],

  [/friedrich|alexander|erlangen/i,"Friedrich-Alexander University"]

function applyRules(v,rules,fallback){
  const s=norm(v); if(!s) return fallback;
  for(const [re,label] of rules) if(re.test(s)) return label;
  return fallback===null?s:fallback;
}
function tally(values,{rules=null,fallback=null,top=0,asPercent=false,total=0}={}){
  const map=new Map();
  values.forEach(v=>{
    let k = rules ? applyRules(v,rules,fallback) : norm(v);
    if(!k||k==="-"||k==="—") return;
    map.set(k,(map.get(k)||0)+1);
  });
  let arr=[...map.entries()].sort((a,b)=>b[1]-a[1]);
  if(top) arr=arr.slice(0,top);
  const base=total||values.length;
  return arr.map(([label,c])=>({label, value: asPercent?Math.round(c/base*100):c, count:c}));
}
function cleanLabel(h){
  return norm(h).replace(/^\s*\d+[\.\)]\s*/,"")
    .replace(/\s*\[[^\]]*\]\s*$/,"").replace(/^ทักษะที่\s*\d+\s*[:：]\s*/,"").trim();
}
function shorten(s,n){ s=norm(s); return s.length>n ? s.slice(0,n).replace(/\s+\S*$/,"")+"…" : s; }

/* คำถามที่ถามรวมในข้อเดียว แต่ต้องรายงานแยกหัวข้อ (คะแนนเท่ากันทั้งสองหัวข้อ) */
const SPLIT_ITEMS=[
  {re:/วันและเวลา.*จำนวนวัน|วันเวลา.*จำนวนวัน|จำนวนวัน.*วันและเวลา/,
   into:["วันและเวลา","จำนวนวันฝึกอบรม"]}
];

/* ต้องเจาะจงพอ — คำว่า "ชื่อ" ลอย ๆ ไปตรงกับ "เชื่อม" / "เชื่อมโยง" ในเนื้อหาหลักสูตร
   ทำให้คอลัมน์คะแนนถูกทิ้งทั้งคอลัมน์ (เจอในหลักสูตร RAG และจะเจอในหลักสูตรงานเชื่อมด้วย) */
const PII_RE=/ชื่อ\s*[-–—]?\s*(สกุล|นามสกุล)|ชื่อจริง|ชื่อผู้|นามสกุล|เลขประจำตัว|บัตรประชาชน|อีเมล|e-?mail|โทรศัพท์|เบอร์โทร|เงินเดือน|สถานที่ทำงาน|สถานที่ทํางาน|คำนำหน้า|คํานําหน้า/i;
const SKIP_RE=/ประทับเวลา|timestamp|ยินยอม|รับทราบ|ลำดับ|^no\.?$/i;

/* ---- 6.4 วิเคราะห์ตาราง → ข้อมูลแดชบอร์ด ---- */
function analyzeRows(rows,{dedup=true}={}){
  const hdr=rows[0].map(norm);
  let body=rows.slice(1).filter(r=>r.some(x=>norm(x)!==""));
  const find=re=>hdr.findIndex(h=>re.test(h));
  const idxName=find(/ชื่อ.?สกุล|ชื่อ-นามสกุล/), idxId=find(/เลขประจำตัว|บัตรประชาชน/),
        idxMail=find(/อีเมล|e-?mail/i);
  let removed=0;
  if(dedup && (idxId>=0||idxMail>=0||idxName>=0)){
    const seen=new Map();
    body.forEach(r=>{
      const key=norm(r[idxId])||norm(r[idxMail]).toLowerCase()||norm(r[idxName]);
      if(!key){ seen.set("__blank"+seen.size,r); return; }
      if(seen.has(key)) removed++;
      seen.set(key,r);
    });
    body=[...seen.values()];
  }
  const col=i=>body.map(r=>i<r.length?r[i]:"");
  const used=new Set();
  const claim=(i)=>{ if(i>=0) used.add(i); return i; };

  const iGender=claim(find(/^\d*\.?\s*เพศ|(^|\s)เพศ(\s|$)/));
  const iAge=claim(find(/อายุ/));
  const iEdu=claim(find(/ระดับการศึกษา|วุฒิการศึกษา/));
  const iMajor=claim(find(/สาขาวิชา|สาขา(?!งาน)/));
  const iInst=claim(find(/สถานศึกษา|สถาบัน|มหาวิทยาลัย|หน่วยงานต้นสังกัด/));
  const iWork=claim(find(/สถานะการมีงานทำ|สถานะการมีงานทํา|สถานะการทำงาน|การมีงานทำ/));

  /* ทักษะ ก่อน–หลัง */
  const BEFORE=/ก่อน\s*(เรียน|อบรม|การอบรม|ฝึกอบรม|เข้าอบรม)?|before/i;
  const AFTER=/หลัง\s*(เรียน|อบรม|การอบรม|ฝึกอบรม|เข้าอบรม)?|after/i;
  const skillMap=new Map();
  hdr.forEach((h,i)=>{
    if(!h||used.has(i)) return;
    const isB=BEFORE.test(h), isA=AFTER.test(h);
    if(!isB&&!isA) return;
    const vals=col(i).map(numOf).filter(v=>v!==null);
    if(!vals.length) return;
    const base=cleanLabel(h.replace(/\[[^\]]*\]/g,"").replace(BEFORE,"").replace(AFTER,""));
    if(!skillMap.has(base)) skillMap.set(base,{});
    skillMap.get(base)[isB?"b":"a"]=i; used.add(i);
  });
  const skills=[];
  skillMap.forEach((v,base)=>{
    if(v.b===undefined||v.a===undefined) return;
    const bv=col(v.b).map(numOf).filter(x=>x!==null), av=col(v.a).map(numOf).filter(x=>x!==null);
    if(!bv.length||!av.length) return;
    /* เก็บชื่อเต็มไว้เสมอ — การย่อเป็นเรื่องของการแสดงผล ไม่ใช่ของข้อมูล */
    skills.push({label:base, full:base,
      before:+(bv.reduce((s,x)=>s+x,0)/bv.length).toFixed(2),
      after:+(av.reduce((s,x)=>s+x,0)/av.length).toFixed(2), n:Math.max(bv.length,av.length)});
  });

  /* ---- สำรอง: หัวคอลัมน์ยาวจนคำว่า [ก่อนเรียน]/[หลังเรียน] ถูกตัดทิ้ง ----
     Google Sheets ตัดหัวคอลัมน์ที่ยาวมาก ทำให้จับคู่ทักษะไม่ได้และข้อมูลหายเงียบ ๆ
     จึงจับคู่คอลัมน์ที่ "ติดกัน + หัวข้อเกือบเหมือนกัน + เป็นคะแนน 1–5 ทั้งคู่"
     โดยถือว่าคอลัมน์ซ้าย = ก่อนเรียน คอลัมน์ขวา = หลังเรียน (ตามลำดับในแบบฟอร์ม) */
  const prefixLen=(a,b)=>{ let k=0; while(k<a.length&&k<b.length&&a[k]===b[k]) k++; return k; };
  const scores1to5=i=>{
    const filled=col(i).map(norm).filter(v=>v!=="");
    const nums=filled.map(numOf).filter(v=>v!==null&&v>=1&&v<=5);
    return (filled.length>=3 && nums.length>=filled.length*0.9) ? nums : null;
  };
  for(let i=0;i<hdr.length-1;i++){
    if(used.has(i)||used.has(i+1)) continue;
    const a=norm(hdr[i]), b2=norm(hdr[i+1]);
    if(!a||!b2||PII_RE.test(a)||SKIP_RE.test(a)) continue;
    if(prefixLen(a,b2)<30) continue;              /* ต้องเหมือนกันยาวพอ ไม่ใช่คำถามคนละข้อ */
    const bv=scores1to5(i), av=scores1to5(i+1);
    if(!bv||!av) continue;
    const base=cleanLabel(a.slice(0,prefixLen(a,b2)));
    skills.push({label:base, full:base, inferred:true,
      before:+(bv.reduce((s,x)=>s+x,0)/bv.length).toFixed(2),
      after:+(av.reduce((s,x)=>s+x,0)/av.length).toFixed(2), n:Math.max(bv.length,av.length)});
    used.add(i); used.add(i+1);
  }

  /* ความพึงพอใจ = คอลัมน์ตัวเลข 1–5 ที่เหลือ */
  const satisfaction=[];
  hdr.forEach((h,i)=>{
    if(!h||used.has(i)||PII_RE.test(h)||SKIP_RE.test(h)) return;
    const filled=col(i).map(norm).filter(v=>v!=="");
    if(filled.length<Math.max(3,body.length*0.4)) return;
    /* ยอมให้มีช่องที่กรอกผิดรูปแบบปนได้เล็กน้อย (เช่น "-" หรือ "ไม่ระบุ")
       แต่ถ้าเกิน 10% ถือว่าไม่ใช่คอลัมน์คะแนน */
    const nums=filled.map(numOf).filter(v=>v!==null&&v>=1&&v<=5);
    if(nums.length<filled.length*0.9) return;
    const avg=nums.reduce((s,x)=>s+x,0)/nums.length;
    const lb=cleanLabel(h);
    /* คำถามที่ถามรวมกันมาในข้อเดียว → แยกเป็น 2 หัวข้อ ใช้คะแนนเดียวกัน
       แต่ถ้าในไฟล์มีคอลัมน์แยกของหัวข้อนั้นอยู่แล้ว จะไม่แยกซ้ำ (กันได้ 8 ข้อ) */
    const split=SPLIT_ITEMS.find(s=>s.re.test(lb));
    const hasOwnColumn = split && split.into.some((name)=>
      hdr.some((h2,j)=>j!==i && cleanLabel(h2)===name));
    if(split && !hasOwnColumn){
      split.into.forEach(name=>satisfaction.push({label:name, full:name+" (จากคำถาม “"+lb+"”)",
        value:+avg.toFixed(2), n:nums.length, split:true}));
    }else{
      satisfaction.push({label:lb, full:lb, value:+avg.toFixed(2), n:nums.length});
    }
    used.add(i);
  });

  /* ข้อความปลายเปิด */
  const textCols=[
    ["reasons",/เหตุผล|แรงจูงใจ|ทำไม/],
    ["suggestions",/ข้อเสนอแนะ|ความคิดเห็น|ปรับปรุง|feedback/],
    ["wanted",/ทักษะที่ต้องการ|อยากพัฒนา|ต้องการพัฒนา/],
    ["jobs",/ประเภทงาน|ตำแหน่งงาน|งานที่สนใจ/],
    ["industries",/อุตสาหกรรม/]
  ];
  const raw={};
  textCols.forEach(([key,re])=>{
    const i=hdr.findIndex((h,k)=>!used.has(k)&&re.test(h)&&!PII_RE.test(h));
    if(i<0) return;
    used.add(i);
    raw[key]=col(i).map(norm).filter(v=>v&&v!=="-"&&v!=="—"&&v.length>1);
  });

  const N=body.length;
  const ages=col(iAge).map(numOf).filter(v=>v!==null&&v>0&&v<120);
  const ageMode=(()=>{ const m=new Map(); ages.forEach(a=>m.set(a,(m.get(a)||0)+1));
    const t=[...m.entries()].sort((a,b)=>b[1]-a[1])[0]; return t?t[0]:0; })();
  const g=col(iGender).map(norm);
  const female=g.filter(v=>/หญิง|female|f$|ญ/i.test(v)).length;
  const male=g.filter(v=>/^ชาย|male|m$|^ช/i.test(v)).length;

  const out={
    respondents:N,
    gender:{female,male},
    age:{avg:ages.length?+(ages.reduce((s,x)=>s+x,0)/ages.length).toFixed(1):0,
         min:ages.length?Math.min(...ages):0, max:ages.length?Math.max(...ages):0, mode:ageMode},
    education: iEdu>=0?tally(col(iEdu),{rules:EDU_RULES,fallback:"อื่น ๆ",asPercent:true,total:N}):[],
    workStatus: iWork>=0?tally(col(iWork),{rules:WORK_RULES,fallback:"อื่น ๆ",asPercent:true,total:N}):[],
    majors: iMajor>=0?tally(col(iMajor),{top:5}):[],
    institutions: iInst>=0?tally(col(iInst),{rules:UNI_RULES,fallback:null,top:6,asPercent:true,total:N}):[],
    satisfaction: satisfaction.map(s=>({label:s.label,value:s.value})),
    skills: skills.map(s=>({label:s.label,before:s.before,after:s.after})),
    raw
  };
  const majorsTotal=iMajor>=0?tally(col(iMajor)).length:0;
  out.majorsNote = majorsTotal>out.majors.length ? `+ อีก ${majorsTotal-out.majors.length} สาขาที่เกี่ยวข้อง` : "";

  const unused=hdr.map((h,i)=>({h,i})).filter(x=>x.h&&!used.has(x.i))
    .map(x=>PII_RE.test(x.h)?{h:x.h,pii:true}:{h:x.h,pii:false});
  return {out, meta:{total:rows.length-1, kept:N, removed, unused, satDetail:satisfaction, skillDetail:skills}};
}

/* ---- 6.5 หน้าจอนำเข้า ---- */
let pendingImport=null;
function startImport(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  /* Safari (และเบราว์เซอร์บางรุ่น) จะไม่เปิดหน้าต่างเลือกไฟล์ ถ้า input ไม่ได้อยู่ในหน้าเว็บจริง
     จึงต้องแปะลงหน้าแบบซ่อนไว้ก่อน แล้วค่อยเก็บกวาดทีหลัง */
  inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
  document.body.appendChild(inp);
  const cleanup=()=>{ if(inp.parentNode) inp.parentNode.removeChild(inp); };

  inp.onchange=async()=>{
    const f=inp.files[0];
    if(!f){ cleanup(); return; }
    toast("กำลังอ่านไฟล์…");
    try{
      let rows;
      if(/\.csv$/i.test(f.name)) rows=readCsvText(await f.text());
      else rows=await readXlsx(f);
      if(!rows||rows.length<2) throw new Error("EMPTY");
      pendingImport={rows, fileName:f.name};
      showImportPreview(true);
    }catch(e){
      const msg = e.message==="NO_DS" ? "เบราว์เซอร์นี้อ่านไฟล์ .xlsx ไม่ได้ — กรุณา Save As เป็น .csv แล้วลองใหม่"
        : e.message==="EMPTY" ? "ไม่พบข้อมูลในไฟล์ (ต้องมีหัวตารางและอย่างน้อย 1 คำตอบ)"
        : e.message==="BAD_ZIP"||e.message==="NO_SHEET" ? "ไฟล์ .xlsx เสียหายหรือไม่ใช่ไฟล์ Excel จริง — ลองเปิดแล้ว Save As ใหม่"
        /* แสดงข้อความจริงด้วย จะได้รู้ว่าติดตรงไหนเวลาแจ้งปัญหา */
        : "อ่านไฟล์ไม่สำเร็จ\n\nรายละเอียด: "+(e&&e.message?e.message:e);
      alert(msg);
    }finally{ cleanup(); }
  };
  /* ถ้าผู้ใช้กดยกเลิกหน้าต่างเลือกไฟล์ onchange จะไม่ทำงาน — เก็บกวาดตอนกลับมาโฟกัสหน้าเว็บ */
  addEventListener("focus",()=>setTimeout(()=>{ if(!inp.files||!inp.files.length) cleanup(); },800),{once:true});
  inp.click();
}

  const satAvg=out.satisfaction.length?out.satisfaction.reduce((s,x)=>s+x.value,0)/out.satisfaction.length:0;

  /* หัวข้อที่คนตอบน้อยกว่าหัวข้ออื่น = สัญญาณว่าเพิ่งเพิ่มคำถามใหม่ในแบบฟอร์ม */
  const maxSatN=Math.max(0,...meta.satDetail.map(s=>s.n));

  if(!out.satisfaction.length) problems.push("ไม่พบคอลัมน์คะแนนความพึงพอใจ (ต้องเป็นตัวเลข 1–5)");

        <tr><td>คำตอบซ้ำที่ตัดออก</td><td class="r">${meta.removed}</td></tr>

      </label>
      <div class="hint">🔒 ไฟล์ถูกอ่านในเครื่องคุณเท่านั้น ไม่ถูกอัปโหลดไปที่ใด และระบบ<b>ไม่บันทึก</b>ชื่อ เลขบัตร อีเมล เบอร์โทร</div>
    </div>

    <div class="fs"><div class="fs-h">ความพึงพอใจ
        <span>พบ ${out.satisfaction.length} หัวข้อ · เฉลี่ยรวม ${n2(satAvg)}/5</span></div>
      <table class="ptab"><tr><th>องค์ประกอบที่ตรวจพบ</th><th style="text-align:right">คะแนน</th><th style="text-align:right">คนตอบ</th></tr>
      ${meta.satDetail.map(s=>`<tr><td>${esc(s.full)}</td><td class="r">${n2(s.value)}</td>
        <td class="r" style="font-weight:400;color:${s.n<maxSatN?"#c07a12":"var(--muted)"}">${s.n}${s.n<maxSatN?" ⚠":""}</td></tr>`).join("")
        ||`<tr><td colspan="3" style="color:var(--muted)">— ไม่พบ —</td></tr>`}
      </table>
      ${thinCols.length?`<div class="hint" style="margin-top:9px;color:#8a6414">

        ทำให้ผู้ตอบชุดเดิมไม่มีคำตอบข้อนั้น ตรวจว่าคะแนนสมเหตุสมผลก่อนยืนยัน</div>`:""}</div>

    <div class="fs"><div class="fs-h">พัฒนาการทักษะ <span>เฉลี่ย +${n2(gain)}</span></div>
      <table class="ptab"><tr><th>ทักษะ</th><th style="text-align:right">ก่อน</th><th style="text-align:right">หลัง</th><th style="text-align:right">เพิ่ม</th></tr>
      ${meta.skillDetail.map(s=>`<tr><td>${esc(shorten(s.full,60))}${s.inferred?` <span class="kpi-badge under">เดาคู่ให้</span>`:""}</td><td class="r">${n2(s.before)}</td><td class="r">${n2(s.after)}</td><td class="r g">+${n2(s.after-s.before)}</td></tr>`).join("")||`<tr><td colspan="4" style="color:var(--muted)">— ไม่พบ —</td></tr>`}

        <b>[ก่อนเรียน] / [หลังเรียน]</b> ทิ้ง ระบบจึงจับคู่จากลำดับคอลัมน์แทน
        (คอลัมน์ซ้าย = ก่อน, ขวา = หลัง) โปรดดูว่าคะแนน “หลัง” ควรมากกว่า “ก่อน” จริงหรือไม่</div>`:""}</div>

    <div class="fs"><div class="fs-h">ข้อมูลผู้เข้าอบรม</div>
      <table class="ptab">
        <tr><td>เพศ</td><td class="r">หญิง ${out.gender.female} · ชาย ${out.gender.male}</td></tr>
        <tr><td>อายุ</td><td class="r">เฉลี่ย ${out.age.avg} ปี (${out.age.min}–${out.age.max}) พบบ่อยสุด ${out.age.mode}</td></tr>
        <tr><td>ระดับการศึกษา</td><td class="r">${out.education.map(e=>esc(e.label)+" "+e.value+"%").join(" · ")||"—"}</td></tr>
        <tr><td>สถานภาพก่อนอบรม</td><td class="r">${out.workStatus.map(e=>esc(e.label)+" "+e.value+"%").join(" · ")||"—"}</td></tr>
        <tr><td>สาขาวิชา (สูงสุด 5)</td><td class="r">${out.majors.map(e=>esc(e.label)+" "+e.value).join(" · ")||"—"}</td></tr>
        <tr><td>สถาบัน (สูงสุด 6)</td><td class="r">${out.institutions.map(e=>esc(e.label)+" "+e.value+"%").join(" · ")||"—"}</td></tr>
      </table></div>

    <div class="fs"><div class="fs-h">คำตอบปลายเปิดที่เก็บไว้ให้อ่าน</div>

        ${Object.keys(out.raw).length?Object.entries(out.raw).map(([k,v])=>
          `<tr><td>${esc(RAW_LABELS[k]||k)}</td><td class="r">${v.length} ข้อ</td></tr>`).join("")

        “ข้อเสนอแนะ” ได้ทีละข้อ</div></div>

    const sc=document.getElementById("mBody").scrollTop;
    showImportPreview(e.target.checked);

function applyImport(){
  const b=DATA.courses[view.ci].batches[view.bi], r=pendingImport.result;
  b.respondents=r.respondents; b.gender=r.gender; b.age=r.age;
  b.education=r.education; b.workStatus=r.workStatus;
  b.majors=r.majors; if(r.majorsNote) b.majorsNote=r.majorsNote;
  b.institutions=r.institutions;
  b.satisfaction=r.satisfaction; b.skills=r.skills;
  b.raw=r.raw;
  b.importedAt=new Date().toISOString().slice(0,10);
  pendingImport=null;
}

/* ---- 6.6 หน้าต่างอ่านคำตอบปลายเปิด ---- */
const RAW_LABELS={reasons:"เหตุผลที่เข้ารับการฝึกอบรม",suggestions:"ความพึงพอใจ / ข้อเสนอแนะ",
  wanted:"ทักษะที่ต้องการพัฒนาเพิ่ม",jobs:"ประเภทงานที่สนใจ",industries:"กลุ่มอุตสาหกรรมที่สนใจ"};
const RAW_TARGET={reasons:"reasons",suggestions:"suggestions",wanted:null,jobs:null,industries:null};
let rawTab=null;
function openRawViewer(){
  const b=DATA.courses[view.ci].batches[view.bi];
  const keys=Object.keys(b.raw||{}).filter(k=>(b.raw[k]||[]).length);
  if(!keys.length){ toast("ยังไม่มีคำตอบปลายเปิด — นำเข้าไฟล์ดิบก่อน"); return; }
  if(!rawTab||!keys.includes(rawTab)) rawTab=keys[0];
  const draw=()=>{
    const list=b.raw[rawTab]||[];
    const target=RAW_TARGET[rawTab];
    const cur=target?(b[target]||[]):null;
    return `
      <div class="rawtabs">${keys.map(k=>`<button class="rawtab ${k===rawTab?"on":""}" data-tab="${k}">
        ${esc(RAW_LABELS[k]||k)} (${b.raw[k].length})</button>`).join("")}</div>
      ${(target&&!VIEWONLY)?`<div class="hint" style="margin-bottom:10px">กด <b>＋ ใส่ในการ์ด</b> เพื่อนำข้อความขึ้นการ์ด
        “${target==="reasons"?"เหตุผลที่เข้าอบรม":"ข้อเสนอแนะเพื่อการพัฒนา"}” บนแดชบอร์ด (แก้ข้อความทีหลังได้ในฟอร์มแก้ไข)</div>`:
        `<div class="hint" style="margin-bottom:10px">${VIEWONLY
          ?"คำตอบดิบทั้งหมดจากผู้เข้าอบรม (ไม่มีข้อมูลระบุตัวตน)"
          :"หมวดนี้เก็บไว้อ่านประกอบ ไม่ได้แสดงบนแดชบอร์ด"}</div>`}
      <ul class="rawlist">${list.map((t,i)=>`<li>
        <span class="i">${i+1}</span><span class="tx">${esc(t)}</span>
        ${(target&&!VIEWONLY)?`<button class="add ${cur.includes(t)?"done":""}" data-add-raw="${i}">
          ${cur.includes(t)?"✓ ใส่แล้ว":"＋ ใส่ในการ์ด"}</button>`:""}
      </li>`).join("")}</ul>`;
  };
  const ov=document.getElementById("overlay"), md=document.getElementById("modal");
  const paint=()=>{
    md.innerHTML=`<div class="modal-h"><div style="flex:1"><h3>คำตอบปลายเปิด — ${esc(b.name)}</h3>
        <div class="sub">คำตอบดิบจากผู้เข้าอบรม (ไม่มีข้อมูลระบุตัวตน)</div></div>
        <button class="btn btn-ghost" id="rClose">✕</button></div>
      <div class="modal-b" id="rBody">${draw()}</div>
      <div class="modal-f"><button class="btn btn-primary" id="rDone">เสร็จสิ้น</button>
        <span class="hint" style="margin-left:auto">${b.raw[rawTab].length} คำตอบ</span></div>`;
    md.querySelector("#rClose").onclick=close;
    md.querySelector("#rDone").onclick=close;
    md.querySelector("#rBody").onclick=e=>{
      const t=e.target.dataset.tab, a=e.target.dataset.addRaw;
      if(t){ rawTab=t; paint(); return; }
      if(a!==undefined){
        const target=RAW_TARGET[rawTab]; if(!target) return;
        const txt=b.raw[rawTab][+a];
        b[target]=b[target]||[];
        if(!b[target].includes(txt)) b[target].push(txt);
        save(); paint();
      }
    };
  };
  const close=()=>{ ov.classList.remove("show"); modalClose=null; render(); };
  modalClose=close;
  /* คลิกพื้นหลังไม่ปิด — ให้พฤติกรรมเหมือนกันทุกหน้าต่าง */
  ov.classList.add("show"); ov.onclick=null;
  paint();
}

/* ---- สร้างไฟล์ .html ไฟล์เดียวที่ฝังข้อมูลปัจจุบันไว้ในตัว ----
   viewonly = true → ไฟล์สำหรับขึ้นเว็บ (ซ่อนปุ่มแก้ไข / นำเข้า / ลบ ทั้งหมด) */
function buildStandalone(viewonly){
  document.getElementById("overlay").classList.remove("show");
  const snapshot=JSON.parse(JSON.stringify(DATA));
  snapshot.exportedAt=new Date().toISOString();

  const clone=document.documentElement.cloneNode(true);
  /* ล้างส่วนที่ JS สร้างขึ้นตอนรัน เพื่อให้ไฟล์ไม่บวมและเริ่มต้นสะอาด */
  ["#main","#navCourses","#modal"].forEach(sel=>{
    const el=clone.querySelector(sel); if(el) el.innerHTML="";
  });
  clone.querySelectorAll("img").forEach(i=>i.removeAttribute("src"));
  clone.querySelectorAll(".overlay").forEach(o=>o.classList.remove("show"));
  ["#presetData","#viewonlyFlag"].forEach(sel=>{
    const el=clone.querySelector(sel); if(el) el.remove();
  });

  const json=JSON.stringify(snapshot)
    .replace(/</g,"\\u003c")                                  /* กันแท็กปิดสคริปต์ที่อาจอยู่ในข้อความ */
    .replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");  /* อักขระขึ้นบรรทัดพิเศษ */
  const head=clone.querySelector("head");
  if(viewonly) head.insertAdjacentHTML("beforeend",
    '<script id="viewonlyFlag">window.__VIEWONLY__=true;<\/script>');
  head.insertAdjacentHTML("beforeend",
    '<script id="presetData">window.__PRESET__='+json+';<\/script>');

  return "<!DOCTYPE html>\n"+clone.outerHTML;
}
function downloadHtml(html,filename){
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click(); URL.revokeObjectURL(a.href);
}
/* ไฟล์นำเสนอ — ก๊อปไปเปิดเครื่องอื่น ยังแก้ไข/นำเข้าข้อมูลต่อได้ตามปกติ */
document.getElementById("btnStandalone").onclick=()=>{
  downloadHtml(buildStandalone(false),
    "BOI-STEM-แดชบอร์ด-นำเสนอ-"+new Date().toISOString().slice(0,10)+".html");
  toast("ได้ไฟล์นำเสนอแล้ว — ก๊อปไฟล์นี้ไฟล์เดียวไปเปิดเครื่องอื่นได้เลย");
};
/* ไฟล์ขึ้นเว็บ — โหมดดูอย่างเดียว ตั้งชื่อ index.html ให้พร้อมอัปโหลด */
document.getElementById("btnWeb").onclick=()=>{
  downloadHtml(buildStandalone(true),"index.html");
  toast("ได้ index.html แล้ว — ลากไฟล์นี้ขึ้นเว็บโฮสต์ได้เลย");
};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.courses) throw 0;
      if(!confirm("นำเข้าข้อมูลนี้แทนข้อมูลปัจจุบัน?")) return;
      DATA=d; save(); view={type:"home",ci:0,bi:0}; render(); toast("นำเข้าข้อมูลเรียบร้อย");
    }catch(err){ toast("ไฟล์ไม่ถูกต้อง"); } };
  r.readAsText(f); e.target.value="";
};
document.getElementById("navHome").onclick=()=>{ view={type:"home",ci:0,bi:0}; render(); };
/* Esc = ปิดหน้าต่าง แต่ผ่านตัวเช็กเดียวกับปุ่ม ✕ (ถ้าแก้ไขค้างไว้จะถามยืนยันก่อน) */
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(modalClose) modalClose();
  else document.getElementById("overlay").classList.remove("show");
});

/* โหมดดูอย่างเดียว: แทนปุ่มจัดการไฟล์ด้วยป้ายบอกสถานะ */
if(VIEWONLY){
  const f=document.querySelector(".side-foot");
  const d=(DATA.exportedAt||"").slice(0,10);
  f.innerHTML='<div class="vo-badge">👁 โหมดดูอย่างเดียว</div>'+
    (d?'<div class="hint" style="padding:2px 2px 0">ข้อมูล ณ วันที่ '+esc(d)+'</div>':"");
}

render();
</script>


</body></html>
